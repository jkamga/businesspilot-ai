<mat-sidenav-container class="shell-container">

  <!-- Side nav -->
  <mat-sidenav mode="side" [opened]="navOpen()" class="sidenav">
    <div class="brand">
      <mat-icon class="brand-icon">rocket_launch</mat-icon>
      <span class="brand-name">BusinessPilot</span>
    </div>

    <mat-nav-list>
      @for (link of navLinks; track link.path) {
        <a mat-list-item
           [routerLink]="link.path"
           routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.key | translate }}</span>
        </a>
      }
    </mat-nav-list>

    @if (authStore.isSuperAdmin()) {
      <mat-divider></mat-divider>
      <mat-nav-list>
        <a mat-list-item routerLink="/admin" routerLinkActive="active-link">
          <mat-icon matListItemIcon>admin_panel_settings</mat-icon>
          <span matListItemTitle>{{ 'nav.admin' | translate }}</span>
        </a>
      </mat-nav-list>
    }
  </mat-sidenav>

  <!-- Main area -->
  <mat-sidenav-content>
    <!-- Top toolbar -->
    <mat-toolbar class="top-bar" color="primary">
      <button mat-icon-button (click)="navOpen.set(!navOpen())">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-spacer"></span>

      <bp-lang-switcher></bp-lang-switcher>

      <!-- User menu -->
      <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-btn">
        <span class="avatar">{{ userInitials }}</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="menu-user-info">
          <strong>{{ authStore.user()?.firstName }} {{ authStore.user()?.lastName }}</strong>
          <span>{{ authStore.user()?.email }}</span>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item routerLink="/subscriptions">
          <mat-icon>workspace_premium</mat-icon>
          {{ 'nav.subscriptions' | translate }}
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          {{ 'nav.logout' | translate }}
        </button>
      </mat-menu>
    </mat-toolbar>

    <!-- Page content -->
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>

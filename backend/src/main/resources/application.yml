server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: businesspilot-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/businesspilot}
    username: ${DB_USERNAME:businesspilot}
    password: ${DB_PASSWORD:businesspilot}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-256-bits-long-secret-key}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  ai:
    provider-api-key: ${AI_PROVIDER_API_KEY:}
    provider-url: ${AI_PROVIDER_URL:https://api.anthropic.com}
    model: ${AI_MODEL:claude-sonnet-4-6}
    max-tokens: ${AI_MAX_TOKENS:2048}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 20

management:
  endpoint:
    health:
      show-details: never

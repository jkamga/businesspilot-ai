spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/businesspilot
    username: businesspilot
    password: businesspilot
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: email, profile

app:
  frontend-url: http://localhost:4200
  jwt:
    secret: YnVzaW5lc3NwaWxvdC10ZXN0LWp3dC1zZWNyZXQta2V5LW11c3QtYmUtMjU2Yml0cw==
    expiry-ms: 86400000
    refresh-expiry-ms: 604800000
  ai:
    provider-api-key: ""
    provider-url: https://api.openai.com
    model: gpt-4o-mini
    max-tokens: 2048
  cors:
    allowed-origins: http://localhost:4200
  whatsapp:
    api-token: ""
    verify-token: test-verify-token
    app-secret: ""
    api-url: https://graph.facebook.com/v20.0
  stripe:
    secret-key: ""
    webhook-secret: ""
    success-url: http://localhost:4200/subscription?success=true
    cancel-url: http://localhost:4200/subscription?cancelled=true

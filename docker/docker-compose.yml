services:

  postgres:
    image: postgres:16-alpine
    container_name: bp_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-businesspilot}
      POSTGRES_USER: ${DB_USERNAME:-businesspilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-businesspilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-businesspilot} -d ${DB_NAME:-businesspilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bp_backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-businesspilot}
      DB_USERNAME: ${DB_USERNAME:-businesspilot}
      DB_PASSWORD: ${DB_PASSWORD:-businesspilot}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MS: ${JWT_EXPIRY_MS:-86400000}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: bp_frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
    restart: unless-stopped
    profiles: ["full"]

  nginx:
    image: nginx:alpine
    container_name: bp_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    profiles: ["full"]

volumes:
  postgres_data:
    driver: local
